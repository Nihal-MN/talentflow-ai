<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="TalentFlow AI — Explainable AI hiring pipeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#16233B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="4" y="316" fill="url(#accent)" opacity="0.9"/>
  <!-- subtle grid -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.55">
    <path d="M0 80 H1280 M0 160 H1280 M0 240 H1280"/>
    <path d="M160 0 V320 M320 0 V320 M480 0 V320 M640 0 V320 M800 0 V320 M960 0 V320 M1120 0 V320"/>
  </g>
  <!-- left: wordmark -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="128" font-size="58" font-weight="700" fill="#F8FAFC" letter-spacing="-1">TalentFlow AI</text>
    <text x="72" y="172" font-size="24" fill="#94A3B8">Explainable AI hiring pipeline</text>
    <g font-size="17" fill="#CBD5E1">
      <rect x="72" y="212" rx="14" width="168" height="30" fill="#1E293B"/>
      <text x="84" y="232">Structured talent data</text>
      <rect x="252" y="212" rx="14" width="150" height="30" fill="#1E293B"/>
      <text x="264" y="232">Semantic matching</text>
      <rect x="414" y="212" rx="14" width="196" height="30" fill="#1E293B"/>
      <text x="426" y="232">Recruiter-in-the-loop</text>
    </g>
    <text x="72" y="284" font-size="15" fill="#64748B">Deterministic-first · Quoted evidence · Zero-config demo</text>
  </g>
  <!-- right: abstract match card -->
  <g transform="translate(760,48)">
    <rect width="452" height="224" rx="16" fill="#0F172A" stroke="#26344F"/>
    <text x="28" y="46" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">Match · Senior Full Stack Engineer</text>
    <text x="28" y="96" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#F8FAFC">75.0<tspan font-size="18" fill="#64748B"> /100</tspan></text>
    <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">
      <text x="28" y="126">must-have 75% · preferred 50% · exp 100% · domain 100%</text>
    </g>
    <!-- bars -->
    <g>
      <rect x="28" y="142" width="396" height="10" rx="5" fill="#1E293B"/>
      <rect x="28" y="142" width="297" height="10" rx="5" fill="#818CF8"/>
      <rect x="28" y="162" width="396" height="10" rx="5" fill="#1E293B"/>
      <rect x="28" y="162" width="198" height="10" rx="5" fill="#818CF8"/>
    </g>
    <!-- status chips -->
    <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
      <rect x="28" y="184" rx="11" width="74" height="24" fill="#052E22"/>
      <text x="40" y="201" fill="#34D399">met ×7</text>
      <rect x="112" y="184" rx="11" width="102" height="24" fill="#3F1D25"/>
      <text x="124" y="201" fill="#FB7185">missing ×2</text>
      <rect x="224" y="184" rx="11" width="118" height="24" fill="#1E293B"/>
      <text x="236" y="201" fill="#94A3B8">evidence ↓</text>
    </g>
    <text x="28" y="240" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#475569">quoted from the resume — every number is re-derivable</text>
  </g>
</svg>
