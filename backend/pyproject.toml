[project]
name = "talentflow-ai-backend"
version = "0.1.0"
description = "TalentFlow AI backend — AI-native hiring pipeline and explainable candidate matching API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy>=2.0.36,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pgvector>=0.3.6,<1.0",
    "python-multipart>=0.0.12,<1.0",
    "pypdf>=5.1,<7.0",
    "python-docx>=1.1,<2.0",
    "numpy>=2.0,<3.0",
    "openai>=1.55,<4.0",
    "fpdf2>=2.8,<3.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/seed/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI dependency-injection calls in defaults are idiomatic
    "RUF001", "RUF002", "RUF003",  # typographic dashes/quotes are intentional in copy
]

[tool.ruff.lint.per-file-ignores]
# Test data (resume/JD fixtures) reads naturally on long lines.
"tests/*" = ["E501"]
