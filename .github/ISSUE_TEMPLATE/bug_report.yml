name: Bug report
description: Something broke or behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please **never paste real candidate data** —
        redact names, emails and phone numbers before submitting.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, including any error message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps so anyone can see the same thing.
      placeholder: |
        1. Go to '…'
        2. Upload '…'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend API
        - Frontend UI
        - Matching engine
        - Ingestion / extraction
        - Docker / setup
        - Docs
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, how you ran it (docker compose / native), AI mode (mock/openai), versions if relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Redact anything personal.
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / additional context
      description: Drag images in if they help. No real candidate data, please.
    validations:
      required: false
